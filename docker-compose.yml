version: '3.8'

services:
  web:
    build: .
    command: gunicorn mysite.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=mysite.settings.prod
      - DATABASE_URL=postgres://ersin:pentagonsecure@db:5432/portfolio
      - SECRET_KEY=django-insecure-replace-this-in-production
      - ALLOWED_HOSTS=*
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=ersin
      - POSTGRES_PASSWORD=pentagonsecure
      - POSTGRES_DB=portfolio
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
